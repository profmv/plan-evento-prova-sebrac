<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minigame: Montagem e Diagnóstico de PC - Recap SENAC 2026</title>
    <script src="../../js/minigame-bridge.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --slot: #334155;
            --accent: #38bdf8;
            --success: #34d399;
            --error: #f43f5e;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 1.5rem; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 1rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.4rem; color: var(--accent); }
        .timer-box { font-size: 1.1rem; font-weight: 700; color: #fbbf24; background: #020617; padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid #475569; }
        
        .workspace { display: grid; grid-template-columns: 280px 1fr; gap: 1.5rem; }
        .inventory { background: var(--panel); padding: 1rem; border-radius: 8px; border: 1px solid #334155; }
        .inventory h2 { font-size: 1rem; margin-bottom: 1rem; color: var(--text-muted); text-transform: uppercase; }
        .component-item { background: #0b1329; border: 1px solid #475569; padding: 0.6rem; border-radius: 6px; margin-bottom: 0.5rem; cursor: pointer; user-select: none; transition: 0.15s; font-size: 0.85rem; }
        .component-item:hover { border-color: var(--accent); background: #172554; }
        .component-item.installed { opacity: 0.4; pointer-events: none; text-decoration: line-through; }
        
        .chassis { background: var(--panel); border: 2px dashed #475569; border-radius: 12px; padding: 1.5rem; position: relative; min-height: 480px; display: flex; flex-direction: column; gap: 1rem; }
        .chassis-header { display: flex; justify-content: space-between; align-items: center; }
        .slots-area { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; flex-grow: 1; }
        .slot-box { background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; justify-content: space-between; min-height: 90px; }
        .slot-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .slot-content { font-weight: 700; color: var(--success); font-size: 0.9rem; margin-top: 0.5rem; }
        .slot-box.empty .slot-content { color: #64748b; font-style: italic; }

        .diagnostics-panel { background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 1rem; margin-top: 1.5rem; font-family: monospace; font-size: 0.85rem; }
        .status-ok { color: var(--success); }
        .status-err { color: var(--error); }
        
        .actions { display: flex; gap: 1rem; margin-top: 1rem; }
        button { cursor: pointer; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 700; border: none; font-size: 0.9rem; }
        .btn-boot { background: var(--accent); color: #0f172a; }
        .btn-boot:hover { background: #0284c7; }
        .btn-reset { background: #334155; color: var(--text); }
        .btn-reset:hover { background: #475569; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Montagem e Diagnóstico de Hardware PC</h1>
            <p style="font-size: 0.85rem; color: var(--text-muted);">UC01 / UC02: Instalação física, arquitetura x86 e teste POST de BIOS/UEFI</p>
        </div>
        <div class="timer-box">Tempo Restante: <span id="timer">20:00</span></div>
    </header>

    <div class="workspace">
        <aside class="inventory">
            <h2>Bancada de Peças</h2>
            <div id="components-list"></div>
        </aside>

        <section class="chassis">
            <div class="chassis-header">
                <h3>Gabinete ATX / Placa-Mãe</h3>
                <span id="step-instruction" style="font-size: 0.85rem; color: var(--accent);">Selecione o primeiro componente na bancada</span>
            </div>

            <div class="slots-area" id="slots-container"></div>

            <div class="actions">
                <button type="button" class="btn-boot" id="btn-power">Ligar PC (Teste POST)</button>
                <button type="button" class="btn-reset" id="btn-reset">Desmontar / Reiniciar</button>
            </div>

            <div class="diagnostics-panel" id="diagnostics-log">
                [POST]: Aguardando acionamento do botão Power...
            </div>
        </section>
    </div>

    <script>
        const REQUIRED_STEPS = [
            { id: "mobo", name: "Placa-mãe B550 (Socket AM4)", slot: "placa_mae", slotName: "Slot do Gabinete: Placa-Mãe" },
            { id: "cpu", name: "Processador AMD Ryzen 5", slot: "socket_cpu", slotName: "Soquete da CPU (AM4)" },
            { id: "paste", name: "Pasta Térmica Prata (Aplicação Gota)", slot: "pasta_termica", slotName: "Superfície Térmica da CPU" },
            { id: "cooler", name: "Air Cooler 120mm com Heatpipes", slot: "cooler_cpu", slotName: "Fixação do Cooler na CPU" },
            { id: "ram", name: "Memória RAM 16GB DDR4 (Dual Channel Slots A2/B2)", slot: "memoria_ram", slotName: "Slots de Memória RAM" },
            { id: "ssd", name: "SSD NVMe M.2 1TB PCIe 4.0", slot: "armazenamento", slotName: "Slot M.2 NVMe" },
            { id: "gpu", name: "Placa de Vídeo RTX 4060 PCIe x16", slot: "slot_pci", slotName: "Slot PCIe x16" },
            { id: "psu", name: "Fonte de Alimentação 650W 80 Plus Bronze", slot: "fonte_energia", slotName: "Compartimento da Fonte" },
            { id: "cables", name: "Cabos de Força (ATX 24p + EPS 8p + PCIe 8p)", slot: "conectores", slotName: "Conectores de Alimentação" }
        ];

        let installedSlots = {};
        let timerSeconds = 20 * 60;
        let timerInterval = null;

        function init() {
            renderInventory();
            renderSlots();
            startTimer();

            document.getElementById("btn-power").addEventListener("click", testPOST);
            document.getElementById("btn-reset").addEventListener("click", resetAssembly);
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timerSeconds > 0) {
                    timerSeconds--;
                    const m = String(Math.floor(timerSeconds / 60)).padStart(2, "0");
                    const s = String(timerSeconds % 60).padStart(2, "0");
                    document.getElementById("timer").textContent = `${m}:${s}`;
                } else {
                    clearInterval(timerInterval);
                    alert("Tempo limite de 20 minutos encerrado!");
                }
            }, 1000);
        }

        function renderInventory() {
            const list = document.getElementById("components-list");
            list.innerHTML = "";
            REQUIRED_STEPS.forEach(item => {
                const div = document.createElement("div");
                div.className = "component-item" + (installedSlots[item.slot] ? " installed" : "");
                div.textContent = item.name;
                div.addEventListener("click", () => installComponent(item));
                list.appendChild(div);
            });
        }

        function renderSlots() {
            const container = document.getElementById("slots-container");
            container.innerHTML = "";
            REQUIRED_STEPS.forEach(item => {
                const box = document.createElement("div");
                const isInstalled = Boolean(installedSlots[item.slot]);
                box.className = "slot-box" + (isInstalled ? "" : " empty");
                box.innerHTML = `
                    <span class="slot-title">${item.slotName}</span>
                    <span class="slot-content">${isInstalled ? installedSlots[item.slot] : "Vazio / Não instalado"}</span>
                `;
                container.appendChild(box);
            });
        }

        function installComponent(item) {
            // Check logical assembly dependencies
            if (item.id === "cpu" && !installedSlots["placa_mae"]) {
                log("[ERRO]: Não é possível instalar o processador antes da placa-mãe estar posicionada.", "err");
                return;
            }
            if (item.id === "paste" && !installedSlots["socket_cpu"]) {
                log("[ERRO]: Você precisa instalar o processador no soquete antes de aplicar pasta térmica.", "err");
                return;
            }
            if (item.id === "cooler" && !installedSlots["pasta_termica"]) {
                log("[ALERTA CRÍTICO]: Instalar o cooler sem pasta térmica causará superaquecimento imediato!", "err");
                return;
            }
            if (item.id === "cables" && (!installedSlots["fonte_energia"] || !installedSlots["placa_mae"])) {
                log("[ERRO]: A fonte e a placa-mãe devem estar no gabinete antes do cabeamento.", "err");
                return;
            }

            installedSlots[item.slot] = item.name;
            log(`[INSTALAÇÃO]: ${item.name} fixado corretamente.`, "ok");
            renderInventory();
            renderSlots();
        }

        function testPOST() {
            const missing = REQUIRED_STEPS.filter(step => !installedSlots[step.slot]);
            if (missing.length > 0) {
                log(`[FALHA DE POST]: O computador não liga! Faltam ${missing.length} componentes essenciais: ${missing[0].name}.`, "err");
                return;
            }

            log("[POST]: 1 BEEP CURTO EMITIDO. Teste de autoverificação de hardware OK!", "ok");
            log("[UEFI BIOS]: Processador AMD Ryzen 5 detectado @ 3.9GHz. Memória: 16384 MB DDR4 Dual Channel. Armazenamento: NVMe 1TB OK.", "ok");
            log("[BOOT]: SENAC OS carregado com sucesso. Missão cumprida!", "ok");

            if (window.MinigameBridge) {
                MinigameBridge.completeGame("pc-hardware", {
                    score: 100,
                    details: "Montagem de computador e POST concluídos com 100% de precisão"
                });
                alert("Parabéns! Sistema montado e aprovado no teste POST. Medalha emitida com sucesso!");
            }
        }

        function resetAssembly() {
            installedSlots = {};
            renderInventory();
            renderSlots();
            log("[POST]: Bancada reiniciada.", "ok");
        }

        function log(msg, type) {
            const panel = document.getElementById("diagnostics-log");
            const div = document.createElement("div");
            div.className = type === "err" ? "status-err" : "status-ok";
            div.textContent = msg;
            panel.appendChild(div);
            panel.scrollTop = panel.scrollHeight;
        }

        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
